<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collaborative Code Editor - Live Demo</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Monaco Editor Loader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
</head>
<body>
  <header id="top-bar">
    <div class="left-section">
      <span class="logo">⚡ CodeCollab</span>
      <span class="badge" id="client-badge">Connecting...</span>
    </div>

    <div class="center-section">
      <span class="room-indicator">🟢 Live Multi-Tab Sync Active</span>
    </div>

    <div class="right-section">
      <label for="language-select">Language:</label>
      <select id="language-select">
        <option value="java" selected>Java</option>
        <option value="python">Python</option>
        <option value="cpp">C++</option>
        <option value="javascript">JavaScript</option>
        <option value="html">HTML</option>
        <option value="json">JSON</option>
      </select>
      <button id="clear-btn" class="btn">Clear</button>
      <button id="copy-btn" class="btn btn-primary">Copy Code</button>
    </div>
  </header>

  <main id="editor-container"></main>

  <footer id="status-bar">
    <div id="cursor-position">Ln 1, Col 1</div>
    <div id="peer-count">👥 Active Tabs: 1</div>
    <div>UTF-8 | Monaco Engine</div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
