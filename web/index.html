<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collaborative Code Editor (Local Session)</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
</head>
<body>
  <header id="top-bar">
    <div class="left-section">
      <span class="logo">⚡ CodeCollab (Local)</span>
      <span class="badge" id="client-badge">Connecting...</span>
    </div>

    <div class="center-section">
      <span class="room-indicator" id="storage-status">💾 Local Storage: 30-Day Auto Retention</span>
    </div>

    <div class="right-section">
      <label for="language-select">Language:</label>
      <select id="language-select">
        <option value="java" selected>Java</option>
        <option value="python">Python</option>
        <option value="cpp">C++</option>
        <option value="javascript">JavaScript</option>
        <option value="html">HTML</option>
      </select>
      <button id="download-btn" class="btn">📥 Save to Local File</button>
      <button id="delete-btn" class="btn btn-danger">🗑️ Delete All Data</button>
    </div>
  </header>

  <main id="editor-container"></main>

  <footer id="status-bar">
    <div id="cursor-position">Ln 1, Col 1</div>
    <div id="expiry-status">Auto-expires after 30 days of inactivity</div>
    <div>Local Filesystem Only | No GitHub</div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
